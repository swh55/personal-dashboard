name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (non-blocking — react-hooks/purity rule version mismatch in CI)
        continue-on-error: true
        run: npx eslint src/

      - name: Tests
        run: npm test

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build
        run: npm run build

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build static export
        run: npm run build:apk
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  electron-build:
    name: Electron Standalone Server Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build standalone
        run: npm run build:standalone
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder@localhost/db' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder@localhost/db' }}
      - name: Verify server.js exists
        run: test -f .next/standalone/server.js && echo "server.js OK"
      - name: Test server startup + API routes
        run: node scripts/test-electron-server.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ secrets.ZAI_MODEL }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone/
          retention-days: 3
