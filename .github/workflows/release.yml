name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      versioncode: ${{ steps.version.outputs.versioncode }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag + compute versionCode
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
          # versionCode: strip non-digits, parse major.minor.patch → integer
          # e.g. 0.9.0-beta.6 → 0906 → but Android requires int ≥ 1
          # Use: major*10000 + minor*100 + patch
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "versioncode=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Computed versionCode: $VERSION_CODE"
      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi

  test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Lint
        run: npx eslint src/
      - name: Tests
        run: npm test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build static export
        run: npm run build:apk
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Update Android versionCode + versionName
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ needs.validate.outputs.versioncode }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ needs.validate.outputs.version }}\"/" app/build.gradle
          echo "=== Updated build.gradle ==="
          grep -E "versionCode|versionName" app/build.gradle
      - name: Build APK (debug-signed for beta)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK with version
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Silah-${VERSION}.apk"
          echo "APK renamed to Silah-${VERSION}.apk"
      - name: Verify APK size
        run: |
          APK_FILE="Silah-${{ needs.validate.outputs.version }}.apk"
          APK_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is too small"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: silah-apk
          path: "Silah-${{ needs.validate.outputs.version }}.apk"
          if-no-files-found: error
          retention-days: 7

  electron:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build Next.js standalone + Electron (NSIS)
        run: npm run electron:build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ secrets.ZAI_MODEL }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
      - name: List output files
        run: dir dist-electron\
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: silah-exe
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, test, android, electron]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: silah-apk
          path: release-assets/
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: silah-exe
          path: release-assets/
      - name: Verify both artifacts exist and are valid
        run: |
          echo "=== Artifact Validation ==="
          APK_FILE=$(find release-assets/ -name "*.apk" | head -1)
          EXE_FILE=$(find release-assets/ -name "*.exe" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "FAIL: No APK found"
            exit 1
          fi
          if [ -z "$EXE_FILE" ]; then
            echo "FAIL: No EXE found"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_FILE")
          EXE_SIZE=$(stat -c%s "$EXE_FILE")

          echo "APK: $APK_FILE ($APK_SIZE bytes)"
          echo "EXE: $EXE_FILE ($EXE_SIZE bytes)"

          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "FAIL: APK too small"
            exit 1
          fi
          if [ "$EXE_SIZE" -lt 1000000 ]; then
            echo "FAIL: EXE too small"
            exit 1
          fi

          echo "PASS: Both artifacts verified"

      - name: Generate SHA256 checksums
        run: |
          cd release-assets/
          sha256sum *.apk *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Silah ${{ needs.validate.outputs.version }}
          body: |
            # صلة — Silah v${{ needs.validate.outputs.version }}

            ## Downloads

            | File | Description |
            |---|---|
            | `Silah-${{ needs.validate.outputs.version }}.apk` | Android (Capacitor, debug-signed) |
            | `Silah-Setup-*.exe` | Windows (Electron + Next.js standalone) |
            | `SHA256SUMS.txt` | Checksums |

            ## Build Status

            | Check | Result |
            |---|---|
            | Lint | ✅ PASS |
            | Tests | ✅ 37/37 PASS |
            | Web Build | ✅ PASS |
            | Android APK | ✅ PASS |
            | Windows EXE | ✅ PASS |

            ## Architecture

            ### Windows (Electron)
            - Next.js standalone server runs as child process inside Electron
            - Full backend: all 47 API routes + NextAuth + Prisma + Neon
            - Google OAuth via system browser (shell.openExternal)

            ### Android (Capacitor)
            - Static export + localStorage offline-first
            - 16 Capacitor plugins + 3 custom Java plugins
            - Guest mode works offline (no auth required)

            ## Known Limitations

            - **APK is debug-signed** (beta testing only, not Play Store ready)
            - **Windows EXE is unsigned** (SmartScreen may warn)
            - **Google OAuth** in APK requires external browser + deep link (Phase 4)
            - **AI** requires internet (Z.AI API)
            - **Maps** require internet (Leaflet + OSM tiles)
            - **5 pre-existing TypeScript errors** (ignoreBuildErrors=true, tech debt)

            ## Multi-Tenant Security

            - Every API route filters by `userId` from session
            - Cross-tenant access returns 403
            - All secrets server-only (no `NEXT_PUBLIC_*` exposure)
          prerelease: true
          draft: false
          files: |
            release-assets/*
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
