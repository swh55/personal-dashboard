name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Lint
        run: npx eslint src/
      - name: Tests
        run: npm test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build static export
        run: npm run build:apk
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Dashboard-${{ needs.validate.outputs.version }}.apk"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-apk
          path: "Dashboard-${{ needs.validate.outputs.version }}.apk"

  electron:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
      - name: Build static export
        run: npm run build:apk
      - name: Build Electron
        run: npm run electron:build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-exe
          path: dist-electron/*.exe
          if-no-files-found: warn

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, android, electron]
    if: always() && needs.android.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: dashboard-apk
          path: release-assets/
      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: dashboard-exe
          path: release-assets/
        continue-on-error: true
      - name: Verify APK exists and is not empty
        run: |
          APK_FILE=$(find release-assets/ -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found in release-assets"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null)
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is too small ($APK_SIZE bytes)"
            exit 1
          fi
          echo "APK verified: $APK_FILE ($APK_SIZE bytes)"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Personal Dashboard ${{ needs.validate.outputs.version }}
          body: |
            ## Release ${{ needs.validate.outputs.version }}

            ### Downloads
            - Android APK: Dashboard-${{ needs.validate.outputs.version }}.apk (DEBUG SIGNED)
            - Windows Installer: check assets (if available)

            ### Status
            - Web Build: PASS
            - Android APK: PASS (debug-signed)
            - Windows Installer: ${{ needs.electron.result == 'success' && 'PASS' || 'NOT BUILT' }}
            - Tests: 28 PASS

            ### Known Limitations
            - APK is debug-signed (testing only)
            - Windows installer may not be available
            - Maps require internet
            - AI requires API key + internet
          prerelease: true
          draft: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
